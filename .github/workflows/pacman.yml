name: Generate Pacman Game

on:
  # بيشتغل تلقائياً كل 24 ساعة
  schedule:
    - cron: "0 0 * * *" 
  
  # بيسمح لك تشغله يدوياً في أي وقت
  workflow_dispatch:
  
  # بيشتغل لما ترفع أي حاجة على فرع main
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # بيولد ملف الـ Pacman SVG
      - name: generate github-contribution-grid-snake.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/pacman.svg?color_snake=#f2c811&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # بيرفع الملفات الناتجة لفرع اسمه output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
